{% extends "base.html" %}
{% block title %}Gate Verification - TicketMe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                <i class="bi bi-qr-code-scan display-5"></i>
            </div>

            <h4 class="fw-bold mb-1">Gate Verification Portal</h4>
            <p class="text-muted small mb-4">Scan ticket QR code using handheld scanner or enter ticket number for admission entry.</p>

            <!-- Ticket Entry Form (Supports Handheld QR/Barcode Scanner & Manual Input) -->
            <form method="GET" action="{{ url_for('verification.check') }}" class="mb-2">
                <div class="input-group input-group-lg">
                    <input type="text" name="ticket_number" id="ticketNumberInput" class="form-control text-uppercase" placeholder="Scan or Enter TKT-2026-XXXXX" autofocus required>
                    <button type="submit" class="btn btn-success fw-semibold px-4"><i class="bi bi-search me-1"></i> Verify</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
