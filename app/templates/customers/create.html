{% extends "base.html" %}
{% block title %}Add Customer - TicketMe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-person-plus me-2 text-primary"></i> Add Customer Profile</h5>
            <form method="POST" action="{{ url_for('customers.create') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">CUSTOMER NAME *</label>
                    <input type="text" name="name" class="form-control" placeholder="Kwame Mensah" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">PHONE NUMBER *</label>
                    <input type="text" name="phone_number" class="form-control" placeholder="0244000000" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">EMAIL ADDRESS</label>
                    <input type="email" name="email" class="form-control" placeholder="kwame@example.com">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">NOTES</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="Special requirements, corporate account, etc."></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('customers.index') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-semibold px-4">Save Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
