{% extends "base.html" %}
{% block title %}Edit Ticket Type - TicketMe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-primary"></i> Edit Ticket Type</h5>
            <form method="POST" action="{{ url_for('ticket_types.edit', tt_id=tt.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">EVENT *</label>
                    <select name="event_id" class="form-select" required>
                        {% for ev in events %}
                            <option value="{{ ev.id }}" {% if tt.event_id == ev.id %}selected{% endif %}>{{ ev.name }} ({{ ev.event_date.strftime('%b %d, %Y') }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">TICKET TYPE *</label>
                    <select name="preset_name" id="ticketTypeSelect" class="form-select" required>
                        <option value="Regular" {% if tt.name == 'Regular' %}selected{% endif %}>Regular</option>
                        <option value="VIP" {% if tt.name == 'VIP' %}selected{% endif %}>VIP</option>
                        <option value="VVIP" {% if tt.name == 'VVIP' %}selected{% endif %}>VVIP</option>
                        <option value="Early Bird" {% if tt.name == 'Early Bird' %}selected{% endif %}>Early Bird</option>
                        <option value="Executive" {% if tt.name == 'Executive' %}selected{% endif %}>Executive</option>
                        <option value="Student" {% if tt.name == 'Student' %}selected{% endif %}>Student</option>
                        <option value="__custom__" {% if tt.name not in ['Regular', 'VIP', 'VVIP', 'Early Bird', 'Executive', 'Student'] %}selected{% endif %}>+ Create Custom Ticket Type...</option>
                    </select>
                </div>

                <div class="mb-3 {% if tt.name in ['Regular', 'VIP', 'VVIP', 'Early Bird', 'Executive', 'Student'] %}d-none{% endif %}" id="customTypeDiv">
                    <label class="form-label fw-semibold text-muted small">CUSTOM TICKET TYPE NAME *</label>
                    <input type="text" name="custom_name" id="customNameInput" class="form-control" value="{{ tt.name }}">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-sm-6">
                        <label class="form-label fw-semibold text-muted small">PRICE (GH₵) *</label>
                        <input type="number" step="0.01" min="0" name="price" class="form-control" value="{{ tt.price }}" required>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label fw-semibold text-muted small">TOTAL QUANTITY *</label>
                        <input type="number" min="1" name="total_quantity" class="form-control" value="{{ tt.total_quantity }}" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">STATUS *</label>
                    <select name="status" class="form-select" required>
                        <option value="Active" {% if tt.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if tt.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('ticket_types.index', event_id=tt.event_id) }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-semibold px-4">Update Ticket Type</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const select = document.getElementById('ticketTypeSelect');
    const customDiv = document.getElementById('customTypeDiv');
    const customInput = document.getElementById('customNameInput');

    function toggleCustom() {
        if (select.value === '__custom__') {
            customDiv.classList.remove('d-none');
            customInput.required = true;
            customInput.focus();
        } else {
            customDiv.classList.add('d-none');
            customInput.required = false;
        }
    }

    select.addEventListener('change', toggleCustom);
});
</script>
{% endblock %}
