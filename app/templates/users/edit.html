{% extends "base.html" %}
{% block title %}Edit User - TicketMe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square me-2 text-primary"></i> Edit User Account</h5>
            <form method="POST" action="{{ url_for('users.edit', user_id=user.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">FULL NAME *</label>
                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">EMAIL ADDRESS</label>
                    <input type="email" class="form-control bg-light" value="{{ user.email }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">PHONE NUMBER</label>
                    <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">USER ROLE *</label>
                    <select name="role" class="form-select" required>
                        <option value="Manager" {% if user.role == 'Manager' %}selected{% endif %}>Manager</option>
                        <option value="Ticket Officer" {% if user.role == 'Ticket Officer' %}selected{% endif %}>Ticket Officer</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">ACCOUNT STATUS *</label>
                    <select name="status" class="form-select" required>
                        <option value="Active" {% if user.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if user.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">NEW PASSWORD (Leave blank to keep unchanged)</label>
                    <div class="input-group">
                        <input type="password" name="password" id="password" class="form-control" minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('users.index') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-semibold px-4">Update User Account</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
