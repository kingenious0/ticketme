{% extends "base.html" %}
{% block title %}Change Password - TicketMe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2 text-primary"></i> Change Password</h5>
            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">CURRENT PASSWORD</label>
                    <div class="input-group">
                        <input type="password" name="current_password" id="current_password" class="form-control" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('current_password', this)" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">NEW PASSWORD</label>
                    <div class="input-group">
                        <input type="password" name="new_password" id="new_password" class="form-control" minlength="6" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('new_password', this)" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">CONFIRM NEW PASSWORD</label>
                    <div class="input-group">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" minlength="6" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirm_password', this)" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
